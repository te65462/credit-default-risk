# CI/CD for the credit card default risk demo.
# Every push and pull request to main runs the tests. When a push to main (or a manual run)
# passes them, space/ is uploaded to the Hugging Face Space, and the live Space is then checked.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_SPACE: Te687780/credit-default-risk  # the Hugging Face Space this repository deploys to

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # as in Module 8, and as in the browser (Pyodide 0.29.5)
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the test packages
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -v

  deploy:
    name: Deploy to Hugging Face
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-to-hugging-face
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Upload space/ to the Space
        # Hugging Face's official sync action, pinned to the commit of release v0.3.0.
        uses: huggingface/hub-sync@fdffea8e04104d0bd4e3181c5feb3025f0433ff5  # v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: static
          subdirectory: space
          hf_version: 2.4.0

  verify:
    name: Check the live Space
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compare the files the Space serves with this commit
        run: python tools/check_live_space.py "$HF_SPACE"
